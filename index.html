<html lang="ar" dir="rtl">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Al Ebtehal Kindergarten Portal | روضة الابتهال</title>
    <meta name="description" content="Official bilingual student performance and progress portal for Al Ebtehal Kindergarten (Academic Year 2026–2027)." />
    <meta property="og:title" content="Al Ebtehal Kindergarten Portal | روضة الابتهال" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script>
      (function() {
        try {
          var t = localStorage.getItem('ebtehal_theme');
          if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F9FAFB] dark:bg-[#09090B] text-zinc-900 dark:text-zinc-100 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
